<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<meta name="theme-color" content="#0b1310" />

		<meta name="color-scheme" content="dark" />

		<meta name="application-name" content="Orelunza" />

		<meta name="apple-mobile-web-app-capable" content="yes" />

		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

		<meta name="format-detection" content="telephone=no" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />

		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
		/>

		<script>
			/*
			 * Apply the visual theme before Svelte starts to prevent a flash
			 * of incorrect colors during the first render.
			 */
			(() => {
				try {
					const storedTheme = localStorage.getItem('orelunza-theme');

					const theme = storedTheme === 'light' ? 'light' : 'dark';

					document.documentElement.dataset.theme = theme;

					document.documentElement.style.colorScheme = theme;
				} catch {
					document.documentElement.dataset.theme = 'dark';

					document.documentElement.style.colorScheme = 'dark';
				}
			})();
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<noscript>
			<div class="orelunza-noscript">
				<h1>JavaScript is required</h1>

				<p>Orelunza needs JavaScript to display the city and manage your session.</p>
			</div>
		</noscript>

		<style>
			.orelunza-noscript {
				box-sizing: border-box;
				min-height: 100vh;
				display: grid;
				place-content: center;
				gap: 0.75rem;
				padding: 2rem;
				text-align: center;
				font-family: Inter, ui-sans-serif, system-ui, sans-serif;
				color: #f1f6f3;
				background: #0b1310;
			}

			.orelunza-noscript h1,
			.orelunza-noscript p {
				margin: 0;
			}

			.orelunza-noscript p {
				max-width: 32rem;
				line-height: 1.6;
				color: #91a39a;
			}
		</style>
	</body>
</html>
